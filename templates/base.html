<!doctype html>
<html lang="en" data-glass="shield">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShieldAI — private evaluation demo{% endblock %}</title>
  <meta name="description" content="A browser-private-key Paillier homomorphic encryption demonstration.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/abheet19/glass@main/src/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/abheet19/glass@main/src/themes/shield.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/abheet19/glass@main/src/primitives.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="glass-page glass-atmosphere">
  <div class="site-shell">
    <header class="site-nav">
      <a class="brand" href="{{ url_for('home') }}" aria-label="ShieldAI home"><span class="brand-mark" aria-hidden="true">◇</span><span>ShieldAI</span></a>
      <p class="nav-note">Paillier · browser-held private key</p>
    </header>
    <main class="site-main">{% block content %}{% endblock %}</main>
    <footer class="site-footer">Educational privacy-enhancing cryptography demo. Synthetic indicator only; not credit, lending, or financial advice.</footer>
  </div>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
